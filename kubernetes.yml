---
# Legacy deployment configuration - kept for reference
# For production use, please use the modern deployment files
# (magento-deployment.yaml, mysql-deployment.yaml, etc.)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: magento-legacy
  namespace: default
  labels:
    app: magento-legacy
spec:
  selector:
    matchLabels:
      app: magento-legacy
  revisionHistoryLimit: 5
  replicas: 2
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: magento-legacy
    spec:
      dnsPolicy: ClusterFirst
      terminationGracePeriodSeconds: 60
      volumes:
        - name: magento
          hostPath:
            path: /var/www/html/magento
            type: DirectoryOrCreate
      containers:
        - name: magento-docker
          # Replace with your own image
          image: magento:2.4-apache
          imagePullPolicy: IfNotPresent
          terminationMessagePolicy: File
          ports:
            - name: web
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: magento
              mountPath: /var/www/html/magento/
              subPath: ''
          resources:
            requests:
              memory: "1Gi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
                - CHOWN
                - SETGID
                - SETUID
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - magento-legacy
                topologyKey: kubernetes.io/hostname
