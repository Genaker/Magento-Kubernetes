apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv
  labels:
    type: local
    app: mysql
spec:
  storageClassName: manual
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/data/mysql"
    type: DirectoryOrCreate
---
# Note: hostPath storage only supports ReadWriteOnce access mode.
# For ReadWriteMany (shared storage across multiple pods), use:
# - NFS server for on-premises
# - AWS EFS, Google Filestore, or Azure Files for cloud deployments
# See examples/ directory for cloud-specific configurations.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: magento-pv
  labels:
    type: local
    app: magento
spec:
  storageClassName: manual
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce  # hostPath only supports ReadWriteOnce
  hostPath:
    path: "/mnt/data/magento"
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: elasticsearch-pv
  labels:
    type: local
    app: elasticsearch
spec:
  storageClassName: manual
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/data/elasticsearch"
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: magento
  labels:
    app: mysql
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: magento-pvc
  namespace: magento
  labels:
    app: magento
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce  # For ReadWriteMany, use NFS or cloud storage
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-pvc
  namespace: magento
  labels:
    app: elasticsearch
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
